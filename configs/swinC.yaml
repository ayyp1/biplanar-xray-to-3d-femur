name: swinC

model:
  arch: SwinUNETR
  feature_size: 48
  use_checkpoint: true   # saves GPU memory

train:
  epochs: 80
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-5
  patience: 20          # early stopping on validation Dice
  seed: 42
  workers: 2
  amp: true

augment:
  pose_prob: 0.8        # chance of rotating the CT and re-projecting the DRRs
  rotate_deg: [15, 10, 15]   # flexion, abduction, axial rotation (+-)
  shift_vox: 4
  gamma: [0.6, 1.6]
  contrast: [0.7, 1.3]
  brightness: 0.1
  blur_prob: 0.3
  blur_sigma: [0.3, 1.5]
  noise_prob: 0.5
  noise_std: 0.04
